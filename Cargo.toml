[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]
# Patched third-party crates (see [patch.crates-io] below); not ours to lint or test.
exclude = ["patches"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

# Registration and scene generation are numeric hot loops; unoptimised, their tests take
# minutes. So are the kd-tree, linear algebra and LAZ decompression they use. Everything
# else (Typst, Tauri, …) builds unoptimised and without debug info: optimising every
# dependency made a cold Windows test build take most of an hour.
[profile.dev.package.locus-register]
opt-level = 2

[profile.dev.package.locus-synth]
opt-level = 2

[profile.dev.package.kiddo]
opt-level = 2

[profile.dev.package.nalgebra]
opt-level = 2

[profile.dev.package.laz]
opt-level = 2

[profile.dev.package."*"]
debug = false

# hypher with the Slovak (GPL-2.0-or-later) and Hungarian (MPL-1.1/GPL/LGPL) hyphenation
# patterns removed; see patches/hypher/PATCH.md and docs/DECISIONS.md.
[patch.crates-io]
hypher = { path = "patches/hypher" }
