[package]
name = "locus"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4.3"
locus-analysis = { version = "0.1.0", path = "../crates/locus-analysis" }
locus-core = { version = "0.1.0", path = "../crates/locus-core" }
locus-io = { version = "0.1.0", path = "../crates/locus-io" }
locus-octree = { version = "0.1.0", path = "../crates/locus-octree" }
locus-photo = { version = "0.1.0", path = "../crates/locus-photo" }
locus-register = { version = "0.1.0", path = "../crates/locus-register" }
locus-report = { version = "0.1.0", path = "../crates/locus-report" }
locus-synth = { version = "0.1.0", path = "../crates/locus-synth" }
nalgebra = "0.35.0"
png = "0.18.1"
roaring = "0.11.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[features]
# Phase 2 rendering spike; see docs/spike-rendering.md. Never enabled in releases.
spike = []
