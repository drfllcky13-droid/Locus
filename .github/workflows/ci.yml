name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Registration on synthetic scans of millions of points takes minutes: its own job, in
  # parallel with the main one (Phase 3 acceptance).
  registration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p locus-register -p locus-synth -- --include-ignored --nocapture

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The runner's preinstalled toolchains we don't use; the 100M-point fixture and the
      # debug and release builds need the room.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Every bundled third-party data file has a licence and attribution entry (CLAUDE.md rule 7).
      - name: Third-party notices are complete
        if: runner.os == 'Linux'
        run: python3 tools/notices/notices.py check --strict
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: 100M-point E57 import stays under 4 GB (Phase 1 acceptance)
        if: runner.os == 'Linux'
        run: cargo test -p locus-io --release --test e57_memory -- --ignored --nocapture

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      # Release compile embeds app/dist, proving the frontend and shell build together.
      - run: pnpm tauri build --no-bundle
      # The built viewer in headless Chromium on software WebGL (SwiftShader), with the
      # backend answered from a recorded fixture: fails on shader or console errors and on a
      # blank canvas. See tools/smoke/README.md.
      - name: Viewer smoke test
        if: runner.os == 'Linux'
        run: |
          pnpm -C app exec playwright install --with-deps chromium
          node tools/smoke/viewer-smoke.mjs
