name: CI

# Sized for the free plan's 2,000 private-repo minutes a month (Windows minutes count
# double). Per push and pull request, Linux only: lint, the fast tests and the app build;
# pushes that change only docs are skipped. Nightly, Windows only (fast tests and app build),
# and only when main's code changed in the last day. Before a release (a v* tag, or run by
# hand): every OS, and the heavy tests. The heavy tests are otherwise run locally before a
# push that touches the code they cover (docs/DECISIONS.md).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**.md", "**.txt"]
  pull_request:
    paths-ignore: ["docs/**", "**.md", "**.txt"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# A newer push to the same branch supersedes a run still in progress (the nightly run has its
# own group, so it never cancels a push's run or is cancelled by one).
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which operating systems this run tests on: Linux per push and pull request; Windows
  # nightly (none if nothing but docs changed in the last 25 hours); both before a release.
  plan:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.os.outputs.os }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
        with:
          fetch-depth: 50
      - id: os
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.ref }}" == refs/tags/* ]]; then
            echo 'os=["ubuntu-latest", "windows-latest"]' >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ -n "$(git log --since='25 hours ago' --format=%H -- . ':!docs' ':!*.md' ':!*.txt')" ]]; then
              echo 'os=["windows-latest"]' >> "$GITHUB_OUTPUT"
            else
              echo 'os=[]' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every bundled third-party data file has a licence and attribution entry (CLAUDE.md rule 7).
      - name: Third-party notices are complete
        run: python3 tools/notices/notices.py check --strict
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  licenses:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  test:
    needs: plan
    if: needs.plan.outputs.os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The runner's preinstalled toolchains we don't use; the build and its cache need the room.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --profile ci
      # Windows-only code paths get linted.
      - if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The heavy group, split across runners so no one runner takes much over ten minutes: each
  # registration acceptance test takes about that long on four cores.
  heavy:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        part:
          - name: hybrid
            filter: "test(/heavy_hybrid/)"
          - name: bad-link
            filter: "test(/heavy_an_injected/)"
          # The ETH3D benchmark and the frame-dump tool need data kept outside the repository.
          - name: rest
            filter: "not (test(/heavy_hybrid/) | test(/heavy_an_injected/) | test(/heavy_eth3d/) | test(/dump_frames/))"
    name: heavy (${{ matrix.os }}, ${{ matrix.part.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The runner's preinstalled toolchains we don't use; the 1 GB E57 fixture and the
      # release build need the room.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: dtolnay/rust-toolchain@stable
      # One release build cache for all parts; the first part saves it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: heavy
          save-if: ${{ matrix.part.name == 'hybrid' }}
      - uses: taiki-e/install-action@nextest
      # Registration accuracy (Phase 3) and the 100M-point E57 import under 4 GB (Phase 1).
      # The app crate (Tauri) has no heavy tests and would need the GUI libraries.
      - run: >-
          cargo nextest run --workspace --exclude locus --release --run-ignored only
          --profile ci -E "${{ matrix.part.filter }}"

  # The validation report (docs/methods/validation.md), regenerated for every release and
  # kept with it; fails the release if any bound isn't met.
  validation:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: validation
      - run: cargo build --release -p locus-validate
      - run: >-
          LOCUS_COMMIT=${{ github.sha }} ./target/release/locus-validate run --full
          --out validation-${{ github.ref_name }}.pdf --json validation-${{ github.ref_name }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ github.ref_name }}
          path: validation-${{ github.ref_name }}.*

  app:
    needs: plan
    if: needs.plan.outputs.os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Release compile embeds app/dist, proving the frontend and shell build together.
      - run: pnpm tauri build --no-bundle
      # The built viewer in headless Chromium on software WebGL (SwiftShader), with the
      # backend answered from a recorded fixture: fails on shader or console errors and on a
      # blank canvas. See tools/smoke/README.md.
      - name: Viewer smoke test
        if: runner.os == 'Linux'
        run: |
          pnpm -C app exec playwright install --with-deps chromium
          node tools/smoke/viewer-smoke.mjs

  # A v* tag publishes a GitHub release: the signed-for-update MSI, latest.json for the in-app
  # updater, and the validation report. The update-signing key is the TAURI_SIGNING_PRIVATE_KEY
  # secret (kept outside the repository; docs/methods/licensing.md).
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: validation
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: pnpm tauri
          args: --bundles msi
          tagName: ${{ github.ref_name }}
          releaseName: Lotus ${{ github.ref_name }}
          releaseBody: The MSI installs Lotus; installed copies update themselves from here. The validation report for this release is attached.
          releaseDraft: false
          includeUpdaterJson: true
      - uses: actions/download-artifact@v4
        with:
          name: validation-${{ github.ref_name }}
      - run: gh release upload ${{ github.ref_name }} validation-${{ github.ref_name }}.pdf validation-${{ github.ref_name }}.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
