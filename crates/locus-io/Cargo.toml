[package]
name = "locus-io"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
e57 = "0.11.13"
gltf = "1.4.1"
imagesize = "0.15.0"
kamadak-exif = "0.6.1"
las = { version = "0.11.1", features = ["laz"] }
locus-core = { version = "0.1.0", path = "../locus-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tobj = { version = "4.0.5", features = ["use_f64"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
