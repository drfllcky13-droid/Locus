[package]
name = "locus-photo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nalgebra = "0.35.0"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[dev-dependencies]
serde_json = "1.0.151"
